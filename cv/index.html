<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Curriculum Vitae of Daniel Goberitz" />
  <title>Daniel Goberitz | CV</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/solid.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/brands.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="toolbar" aria-label="CV controls">
    <div class="toolbar__inner">
      <span class="toolbar__label">CV / V2</span>
      <div class="toolbar__actions">
        <button class="language-button is-active" data-language="en" type="button">EN</button>
        <button class="language-button" data-language="es" type="button">ES</button>
        <button class="print-button" id="print-button" type="button"><i class="fas fa-print"
            aria-hidden="true"></i><span data-copy="print"></span></button>
      </div>
    </div>
  </header>
  <main id="cv" class="cv-shell" aria-live="polite">
    <div class="loading">Loading CV...</div>
  </main>
  <script src="app.js"></script>
</body>

</html>
